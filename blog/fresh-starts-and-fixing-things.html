  <!-- Script to load prose -->
  <script>
    (async function loadProse() {
      const prose = document.getElementById('post-prose');
      const src = '/assets/prose/2025-11-04-fresh-starts-and-fixing-things.txt';

      try {
        const res = await fetch(src);
        if (!res.ok) throw new Error(res.status);
        const text = await res.text();
        prose.innerHTML = text
          .trim()
          .split(/\n\s*\n/)
          .map(p => `<p>${escapeHtml(p).replace(/\n/g, '<br>')}</p>`)
          .join('');
      } catch (e) {
        prose.innerHTML = `<p>Could not load post content. (${e.message})</p>`;
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }
    })();
  </script>
